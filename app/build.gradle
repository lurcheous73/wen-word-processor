}

android {
    namespace "uk.brimstone.simpletype"
    compileSdk 37

    defaultConfig {
        applicationId "uk.brimstone.simpletype"
        minSdk 29
        targetSdk 37
        versionCode 3
        versionName "0.1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.alphacephei:vosk-android:0.3.75"
}
